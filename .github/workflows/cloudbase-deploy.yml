name: Deploy to CloudBase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  TCB_ENV_ID: fay-d5gs45yh46ccad4d7

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static build
        run: test -f dist/index.html && test -f dist/script.js

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install CloudBase CLI
        run: npm install --global @cloudbase/cli

      - name: Login to CloudBase
        env:
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        run: tcb login --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY"

      - name: Deploy static hosting
        run: tcb hosting deploy ./dist /home --env-id "$TCB_ENV_ID"
